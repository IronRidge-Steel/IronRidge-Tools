<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IronRidge Rep Tools</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1c2126;
    --line: #2c343b;
    --text: #e8ecef;
    --muted: #9aa5ad;
    --accent: #c8622a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 20px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { border-bottom: 2px solid var(--accent); padding-bottom: 16px; margin-bottom: 32px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.tool {
    display: block;
    padding: 20px 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, transform .15s;
  }
  a.tool:hover { border-color: var(--accent); transform: translateY(-1px); }
  .name { font-weight: 600; font-size: 17px; }
  .desc { color: var(--muted); font-size: 14px; margin-top: 4px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>IronRidge Rep Tools</h1>
      <div class="sub">Internal reference tools for IronRidge Steel sales reps</div>
    </header>
    <ul>
      <li>
        <a class="tool" href="shop-locator/">
          <div class="name">Shop Locator</div>
          <div class="desc">Interactive US map of manufacturer shop locations</div>
        </a>
      </li>
    </ul>
    <footer>IronRidge Steel Structures</footer>
  </div>
</body>
</html>
